[project]
name = "trace2eval"
version = "0.1.0"
description = "Trace mining and regression eval generation for coding-agent runs."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Trace2Eval contributors" }]
license = { text = "MIT" }
dependencies = [
    "orjson>=3.10.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "rich>=13.7.0",
    "typer>=0.12.3",
]

[project.scripts]
trace2eval = "trace2eval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
